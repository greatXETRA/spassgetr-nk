<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Check</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <main class="card" role="main" aria-labelledby="card-title">
    <h1 id="card-title" class="card__title">Security Check</h1>
    <p class="card__subtitle">Please verify that you are human</p>

    <div class="captcha" id="captcha">
      <button
        type="button"
        id="captchaToggle"
        class="captcha__control"
        role="checkbox"
        aria-checked="false"
        aria-describedby="captcha-status"
      >
        <span class="captcha__box" aria-hidden="true">
          <span class="captcha__spinner"></span>
          <svg class="captcha__cross" viewBox="0 0 24 24" focusable="false">
            <path d="M6 6 L18 18 M18 6 L6 18" />
          </svg>
        </span>
      </button>

      <span class="captcha__label">I'm not a robot</span>

      <span id="captcha-status" class="captcha__status" role="status" aria-live="polite"></span>

      <div class="captcha__footer" aria-hidden="true">
        <span class="captcha__footer-text">Privacy&nbsp;·&nbsp;Terms</span>
      </div>
    </div>

    <section class="audit" id="audit" aria-labelledby="audit-title" hidden>
      <h2 id="audit-title" class="audit__title">Bot-Audit</h2>
      <p class="audit__intro">Eine letzte Frage, rein zur Sicherheit.</p>

      <div class="audit__question-wrap">
        <p id="auditQuestion" class="audit__question" aria-live="polite"></p>
      </div>

      <form id="auditForm" class="audit__form">
        <label for="auditAnswer" class="visually-hidden">Deine Antwort</label>
        <textarea
          id="auditAnswer"
          class="audit__textarea"
          rows="3"
          placeholder="Deine Antwort…"
          disabled
          required
        ></textarea>
        <button type="submit" id="auditSubmit" class="audit__submit" disabled>Antworten</button>
      </form>

      <div id="auditLoader" class="audit__loader" hidden aria-hidden="true"></div>

      <div id="auditResult" class="audit__result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script src="script.js?v=2"></script>
  <script src="audit.js?v=4"></script>
</body>
</html>
