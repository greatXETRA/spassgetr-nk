<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BonusProgramm Karte</title>
    <style>
        /* Grundlegendes Reset und Mobile-Optimierung */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1c1d26; /* Dunkler Hintergrund aus Screenshot 2 */
            color: #ffffff;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Begrenzung für größere Bildschirme, um Handy-Look zu wahren */
            min-height: 100vh;
            background-color: #1c1d26;
            position: relative;
        }

        /* Header mit Fertig-Button */
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
            margin-top: 10px;
        }

        .btn-fertig {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            border-bottom: 1px solid #3a3b45;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            font-size: 15px;
            color: #a0a0a0;
            cursor: pointer;
        }

        .tab.active {
            color: #ffffff;
            font-weight: bold;
            border-bottom: 3px solid #ffffff;
        }

        /* Die goldene Karte (angelehnt an Screenshot 1) */
        .card-container {
            padding: 0 15px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(135deg, #f7df94 0%, #e0bd63 50%, #cca346 100%);
            border-radius: 16px;
            height: 200px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            color: #1a1a1a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Linien-Muster im Hintergrund der Karte (aus Screenshot 1) */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                rgba(0, 0, 0, 0.03) 5px,
                rgba(0, 0, 0, 0.03) 10px
            );
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .logo {
            background-color: #ff0000;
            color: white;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 18px;
            letter-spacing: -1px;
        }

        .brand {
            font-weight: bold;
            font-size: 18px;
        }

        .card-body {
            z-index: 2;
        }

        .card-body h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: -5px;
        }

        .card-body p {
            font-size: 14px;
            color: #444;
        }

        /* Hologramm-Animation (Hin- und Her-Bewegung) */
        .hologram {
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.5) 40%,
                rgba(255, 230, 255, 0.7) 50%,
                rgba(255, 255, 255, 0.5) 60%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            animation: hologram-move 4s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes hologram-move {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        /* Listenbereich unter der Karte */
        .info-list {
            list-style: none;
            background-color: #252631;
            border-top: 1px solid #3a3b45;
        }

        .info-list li {
            padding: 18px 20px;
            border-bottom: 1px solid #3a3b45;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .info-list .label {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .info-list .value {
            font-size: 17px;
            color: #ffffff;
            font-weight: 500;
        }

        .info-list .icon-right {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 20px;
        }
        
        .single-line {
            flex-direction: row !important;
            justify-content: space-between;
            align-items: center;
        }
        
        .single-line .label {
            margin-bottom: 0;
            font-size: 17px;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <button class="btn-fertig">Fertig</button>
        </header>

        <nav class="tabs">
            <div class="tab active">BonusProgramm Karte</div>
            <div class="tab">Punkte sammeln</div>
        </nav>

        <main>
            <div class="card-container">
                <div class="card">
                    <!-- Das bewegliche Hologramm -->
                    <div class="hologram"></div>
                    
                    <div class="card-header">
                        <div class="logo">DB</div>
                        <div class="brand">BonusProgramm</div>
                    </div>
                    <div class="card-body">
                        <h2>gold</h2>
                        <p>Statuslevel</p>
                    </div>
                </div>
            </div>

            <ul class="info-list">
                <li>
                    <span class="label">BonusProgramm Nummer</span>
                    <span class="value">3937 1868 8992</span>
                    <span class="icon-right">📄</span>
                </li>
                <li class="single-line">
                    <span class="label">Nummer vergrößern</span>
                    <span class="icon-right">🔍</span>
                </li>
                <li>
                    <span class="label">Karteninhaber</span>
                    <span class="value">Henning Oberscheidt</span>
                </li>
            </ul>
        </main>
    </div>

</body>
</html>
